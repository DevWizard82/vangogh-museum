  <path d="M2 26 Q10 16 18 14 Q26 10 30 18" fill="none" stroke="#4a7cc0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M4 28 Q12 22 20 20 Q26 17 30 22" fill="none" stroke="#2a5a9a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Stars -->
  <circle cx="8"  cy="8"  r="1.6" fill="#f0d060"/>
  <circle cx="20" cy="5"  r="2.0" fill="#f5e070"/>
  <circle cx="26" cy="9"  r="1.3" fill="#f0d060"/>
  <circle cx="14" cy="11" r="1.0" fill="#fff8c0"/>

  <!-- Moon -->
  <circle cx="24" cy="7" r="3.2" fill="#f5e890"/>
  <circle cx="24" cy="7" r="2.0" fill="#fff8d0"/>

  <!-- Ground -->
  <rect x="0" y="24" width="32" height="8" fill="#1a1005"/>

  <!-- Gold frame -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="none" stroke="#c8a254" stroke-width="1.2"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="#8a6a2a" stroke-width="0.5"/>
</svg>